<title>Shop Cuts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Shop tablet: read the finished cut sheets at the saw and tick off what's cut */
:root{
  --bg:#F4EFE7;--card:#FFFDF9;--ink:#2A2622;--muted:#6B635A;--line:#E3DACC;--field:#FAF6F0;
  --chip:#EFE8DC;--chip2:#EAE3D8;--dash:#D8CDBC;
  --amberbg:#FBEBD0;--amberink:#6B4210;--bad:#A12D22;--badbg:#FBE9E6;--onaccent:#FFFDF9;
  --accent:#2F5D50;--tint:#EEF4F1;--tint2:#E4EDE9;--deep:#21443A;
  --done:#DCEFD8;--doneink:#2E6B2A;--float:#9C0006;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 var(--font);-webkit-text-size-adjust:100%}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:16px;overflow:hidden;background:#E8590C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{display:block;font-size:22px;font-weight:900}
.hello{padding:30px 0 18px}
.hello h1{margin:0;font-size:clamp(32px,5vw,42px);line-height:1.1;font-weight:900}
.hello p{margin:8px 0 0;font-size:20px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:14px;padding:0 18px;background:var(--chip);color:var(--ink);font-size:17px;font-weight:800}
.btn.pri{background:var(--accent);color:var(--onaccent)}
.btn.ghost{background:transparent}
.round{width:56px;height:56px;border-radius:28px;border:0;background:var(--chip2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg{border-radius:18px;padding:14px 16px;margin:0 0 16px;font-weight:700;line-height:1.45}
.msg.ok{background:var(--tint2);color:var(--deep)}
.msg.err{background:var(--badbg);color:var(--bad)}
.note{border-radius:18px;padding:14px 16px;background:var(--amberbg);color:var(--amberink);font-weight:800;margin-bottom:14px}

/* job list */
.jobs{display:flex;flex-direction:column;gap:12px}
.job{display:flex;align-items:center;gap:16px;background:var(--card);border:0;border-radius:22px;padding:18px 20px;text-align:left;box-shadow:0 2px 0 var(--line);width:100%}
.job .t{flex:1;min-width:0}
.job b{display:block;font-size:22px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .s{font-size:16px;color:var(--muted);font-weight:700}
.job .cnt{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:8px 12px;border-radius:16px;background:var(--tint2);color:var(--deep);font-size:15px;font-weight:800;line-height:1.1}
.job .cnt b{display:block;font-size:30px;font-weight:900;white-space:nowrap}
.job .cnt.warn{background:var(--amberbg);color:var(--amberink);max-width:150px;text-align:center}
.ring{width:64px;height:64px;flex-shrink:0}
.ring text{font-size:15px;font-weight:900;fill:var(--ink)}
.job.done{background:var(--done)}
.empty{background:var(--card);border-radius:22px;padding:28px;text-align:center;color:var(--muted);font-weight:700}

/* job view */
.apphead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.apphead .ttl{flex:1;min-width:0}
.apphead h2{margin:0;font-size:26px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border-radius:6px;background:var(--chip2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .2s}
.jobtop{position:sticky;top:0;z-index:5;background:var(--bg);margin:-18px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-left,0px)) 0;transition:transform .22s ease;will-change:transform}
body.tuck .jobtop{transform:translateY(-100%)}
body.tuck table.sheet tr.hdr td{top:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;background:var(--bg);scrollbar-width:none;height:76px;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:56px;padding:0 20px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:900;white-space:nowrap}
.tab small{font-weight:800;color:var(--muted);margin-left:6px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.tab.on small{color:var(--onaccent);opacity:.85}
.tab.full{border-color:var(--doneink)}
.sheetwrap{background:var(--card);border-radius:20px;padding:10px;overflow-x:auto;box-shadow:0 2px 0 var(--line)}
table.sheet{border-collapse:separate;border-spacing:0;min-width:100%;font-size:18px;font-variant-numeric:tabular-nums}
table.sheet td{border-bottom:1px solid #E6DCC9;border-right:1px solid #EFE7DA;padding:7px 8px;vertical-align:middle;white-space:nowrap}
table.sheet td.wrapcell{white-space:normal;min-width:150px;max-width:240px}
table.sheet td.b{font-weight:900}
table.sheet td.num{text-align:right}
table.sheet td.c{text-align:center}
table.sheet td.chk{width:66px;min-width:66px;text-align:center;padding:10px 6px;cursor:pointer}
.box{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:14px;border:3px solid #B9AE9C;background:#fff;font-size:32px;font-weight:900;color:transparent}
td.chk.on .box{background:var(--doneink);border-color:var(--doneink);color:#fff}
/* every second line yellowish so rows are easy to follow; data lines get room for gloved fingers */
table.sheet tr.data td{height:76px;font-size:26px;font-weight:800;letter-spacing:.2px}
table.sheet tr.info td{font-size:15px;padding:4px 8px;font-weight:700}
table.sheet tr.hdr td{font-size:16px;position:sticky;top:calc(var(--toph,160px) / var(--z,1));transition:top .22s ease;z-index:2;background:#E7DFCF!important;box-shadow:0 2px 0 #D5CBB8}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:.9;margin-left:3px;font-size:.62em;font-weight:900}
.fr sup,.fr sub{font-size:1em;line-height:1;vertical-align:baseline;position:static}
.fr .sl{display:block;width:100%;height:0;border-top:2px solid currentColor;font-size:0;margin:2px 0}
.at{color:var(--muted);font-weight:700;margin:0 4px 0 1px;font-size:.8em}
table.sheet tr:nth-child(odd) td{background:#FFFDF8}
table.sheet tr:nth-child(even) td{background:#FFF4D2}
table.sheet tr.data:nth-child(even) td{background:#FFF1C4}
/* a ticked box tints the value it belongs to; a finished line goes green but stays readable */
table.sheet td.cut{background:rgba(46,140,62,.28)!important;font-weight:900}
tr.rowdone td{background:#D7EED1!important}
tr.rowdone td.cut{background:rgba(46,140,62,.38)!important}
tr.rowdone td:first-child{box-shadow:inset 6px 0 0 #2E8C3E}
tr.tap{cursor:pointer}
.fin{background:var(--card);border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 2px 0 var(--line)}
.fin.complete{background:var(--done)}
.fin .fh{display:flex;align-items:center;gap:16px}
.fin .fh b{display:block;font-size:24px;font-weight:900}
.fin .fh span{color:var(--muted);font-weight:700}
.fin.complete .fh span{color:var(--doneink)}
.fbox{width:48px;height:48px;border-radius:12px;border:3px solid var(--dash);background:var(--field);display:flex!important;align-items:center;justify-content:center;flex-shrink:0;font-size:28px;font-weight:900;color:var(--onaccent)!important}
.fbox.on{background:var(--doneink);border-color:var(--doneink)}
.fin .frow{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center}
.btn.big{min-height:64px;min-width:130px;font-size:20px;border-radius:16px}
.fin select,.fin input{min-height:64px;font-size:20px;font-weight:700;border-radius:16px;border:2px solid var(--line);background:var(--field);padding:0 16px;min-width:260px}
.fnote{margin:12px 0 0;font-weight:700;color:var(--amberink)}
.fin-tag{color:var(--doneink);font-weight:800}
.mgrh{font-size:22px;font-weight:900;margin:4px 0 6px}
.mgrh2{margin-top:22px}.mgrh3{margin-top:34px}
.prio{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:0 2px 0 var(--line)}
.prow.rest{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.pnum{flex-shrink:0;width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
.pname{flex:1;min-width:0;font-size:19px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pday{flex-shrink:0;color:var(--muted);font-weight:700;font-size:15px}
.pbtn{flex-shrink:0;min-width:48px;height:48px;border-radius:12px;border:0;background:var(--tint2);color:var(--deep);font-size:18px;font-weight:900;cursor:pointer}
.pbtn:disabled{opacity:.3;cursor:default}
.pbtn.px{background:#F3E1DC;color:#9C0006}
.pbtn.padd{padding:0 16px}
.pempty{color:var(--muted);font-weight:700;padding:10px 2px}
.pclear{margin-top:10px;background:none;border:0;color:#9C0006;font-weight:800;font-size:16px;text-decoration:underline;cursor:pointer;padding:6px 2px}
.job b .pri{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:1px 9px;margin-right:9px;font-size:18px;vertical-align:2px}
.prcard{background:#FCE8DC;border:3px solid #E8590C;border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prhead{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;color:#8A3205;padding:4px 8px 2px}
.prhead span:not(.prflame){font-size:16px;font-weight:800;color:#A5501F}
.prflame{font-size:24px}
.prcard .job b .pri{background:#E8590C}
.ipcard{background:var(--tint);border-color:var(--accent)}
.ipcard .prhead{color:var(--deep)}
.ipcard .prhead span:not(.prflame){color:var(--accent)}
.prrest{font-size:18px;font-weight:900;color:var(--muted);margin:12px 4px 0}
table.sheet tr.stickrow td{background:#2B2620;color:#fff;font-weight:800;font-size:17px;padding:9px 12px;border-color:#2B2620}
table.sheet tr.stickrow .sk{display:inline-block;background:#E8590C;border-radius:8px;padding:2px 10px;margin-right:10px;font-weight:900}
table.sheet tr.stickrow .sk.warn{background:#9C0006}
.mgrh4{font-size:17px;font-weight:900;color:var(--muted);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.pnum.on2{background:var(--tint2);color:var(--deep)}
.scrhead{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between;background:var(--tint);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.scrinfo{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:20px;font-weight:800}
.scrinfo i,.scrparts i{display:block;font-style:normal;font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.scrparts{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;font-size:17px;font-weight:700}
.scrparts i{width:100%}
.scrparts .sp b{font-size:22px;font-weight:900;margin-right:6px}
.mgrnote{color:var(--muted);font-weight:700;margin:0 0 14px}
.mgrwrap{overflow-x:auto}
table.mgr{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden;font-size:18px}
table.mgr th{text-align:left;background:#E7DFCF;padding:12px 14px;font-size:15px}
table.mgr td{padding:14px;border-top:1px solid var(--line);font-weight:700}
table.mgr td.num{font-size:22px;white-space:nowrap}
table.mgr .mut{color:var(--muted);font-weight:600}
table.sheet td.floatrail{color:#9C0006!important;font-weight:900}
/* numbered section headings (1 · Post cutting, 2 · Blocking, 3 · Bracketing): all the same */
table.sheet tr.sechead td{background:var(--tint2)!important;color:var(--deep)!important;font-size:20px!important;font-weight:900!important;text-align:left!important;padding:12px 14px!important;border-top:3px solid var(--accent)}
table.sheet tr.sechead td.postsall{text-align:right!important;padding:6px 8px!important}
table.sheet tr.subhdr td{background:#E7DFCF!important;font-size:16px;box-shadow:0 2px 0 #D5CBB8}
table.sheet td.postsall{text-align:right;padding:6px 8px}
.pcut{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 18px 0 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:900;color:var(--ink)}
.pcut .box{width:38px;height:38px;border-radius:10px;border:3px solid var(--dash);background:var(--field);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:22px}
.pcut.on{background:var(--done);border-color:var(--doneink);color:var(--doneink)}
.pcut.on .box{background:var(--doneink);border-color:var(--doneink);color:var(--onaccent)}
.sortbar{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;margin:0;overflow-x:auto;scrollbar-width:none}
.sortbar .sseg{display:inline-flex;align-items:center;flex-shrink:0}
.sortbar .sgl{font-size:14px;font-weight:900;color:var(--muted);margin:0 6px 0 4px;white-space:nowrap}
.sortbar .sseg .sbtn{border-radius:0}
.sortbar .sseg .sbtn:nth-child(2){border-radius:12px 0 0 12px;border-right-width:1px}
.sortbar .sseg .sbtn:nth-child(3){border-radius:0 12px 12px 0;border-left-width:1px}
table.sheet tr.sortrow td{background:var(--card)!important;padding:12px 8px!important;border-top:2px solid var(--line)}
.sortbar .sgrp{display:inline-flex;align-items:center;gap:10px;padding-left:14px;border-left:2px solid var(--line)}
.sortbar .slab{font-weight:900;color:var(--muted);margin-right:2px;flex-shrink:0}
.sbtn{min-height:50px;padding:0 13px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:16px;font-weight:800;white-space:nowrap;flex-shrink:0}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
table.sheet tr.laysec td{border-top:6px solid var(--accent)}
.modal.alert .box2{border:4px solid var(--amberink);max-width:560px}
.modal.alert #modalText{font-size:21px;line-height:1.45}
.modal.alert #modalText b.big{display:block;font-size:28px;color:var(--amberink);margin-bottom:8px}
/* post + block heights on the Cover and Post Sheet */
table.sheet td.hilab,table.sheet td.hival{background:#FFD43B!important;color:#1A1714!important;font-weight:900!important;border:2px solid #E0A800!important}
table.sheet td.hilab{font-size:19px!important;text-transform:uppercase;letter-spacing:.03em}
table.sheet td.hival{font-size:26px!important}
table.sheet td.hival.hicustom{background:#9C0006!important;color:#fff!important;border-color:#6E0004!important}
.donehead{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;margin-top:14px;padding:0 20px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:900;color:var(--ink);text-align:left}
.donesearch{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.donesearch input{flex:1;min-height:60px;font-size:20px;font-weight:700;border-radius:16px;border:2px solid var(--line);background:var(--field);padding:0 18px}
.donesearch span{color:var(--muted);font-weight:800;white-space:nowrap}
.job[hidden]{display:none!important}
.donehead.donenone{color:var(--muted);font-size:19px}
.donehead .chev{font-size:22px;width:22px;color:var(--doneink)}
.donehead span{color:var(--muted);font-weight:700;font-size:17px}
.donering{width:64px;height:64px;flex-shrink:0;border-radius:50%;background:var(--doneink);color:var(--onaccent);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
#logo{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#logo svg{pointer-events:none}
.ver{color:var(--muted);font-size:13px;font-weight:700;text-align:center;margin:28px 0 8px;opacity:.8}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#1F1B17;color:#fff;font-size:19px;font-weight:800;padding:16px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .35s,transform .35s;white-space:nowrap}
.toast.out{opacity:0;transform:translate(-50%,12px)}
.signoff{color:#8A4B00;font-weight:900;background:#FFE8A3;border-radius:8px;padding:2px 8px}
table.sheet td.divl{border-left:3px solid #1F1B17!important}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 4px 0;color:var(--muted);font-size:15px;font-weight:700}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(42,38,34,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box2{background:var(--card);border-radius:24px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px}
.modal p{margin:0;font-size:18px;font-weight:700}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal input{height:60px;border-radius:16px;border:2px solid var(--line);background:var(--field);padding:0 16px;font-size:22px;font-weight:800;width:100%}
/* unit layout drawings on the Cut Sheet */
table.sheet tr.unitbar td{background:#EAF1EE!important;padding:6px 8px;border-top:3px solid #CFE0D8}
.laybtn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:0;border-radius:14px;background:transparent;font-size:19px;font-weight:900;color:var(--deep)}
.laybtn .lb{width:34px;height:34px;border-radius:10px;border:3px solid #9FB8AE;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.laybtn .lb.on{background:var(--accent);border-color:var(--accent)}
table.sheet tr.layrow td{background:#F7FAF8!important;white-space:normal;padding:10px}
.layout{max-width:900px;margin:0 auto}
svg.laysvg{width:100%;max-height:440px;display:block}
.laykey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;font-weight:700;color:var(--muted);margin-top:6px}
.laykey span{display:inline-flex;align-items:center;gap:6px}
.laykey i{display:inline-block;width:10px;height:10px;background:var(--ink)}
.laykey i.k-fl{width:18px;height:6px;border-radius:3px;background:var(--float)}.laykey i.k-fp{background:var(--card);border:2px solid var(--ink)}
.laykey i.k-cor{border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.laykey i.k-jt{border-radius:50%;width:8px;height:8px}
.laykey i.k-mid{width:7px;height:7px;outline:2px solid var(--card)}
/* welding: the At welding / Ready to weld card, and the weld tablet's Cut Sheet */
.atweld{color:#8A3205;font-weight:800}
.wcard{background:#FFF3E6;border-color:#E8590C;margin-top:6px}
.job.wait{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.waitring{display:flex;align-items:center;justify-content:center;border-radius:50%;border:8px solid #EAE3D8;color:var(--muted);font-weight:900;font-size:20px}
table.sheet td.wh{font-weight:900;text-align:center;color:#8A3205}
table.sheet td.chk.wchk{width:92px;min-width:92px;padding:8px 10px;border-right:3px solid #1F1B17}
table.sheet td.wh,table.sheet td.wpad{border-right:3px solid #1F1B17}
td.wchk .box{width:64px;height:64px;border-radius:16px;border:4px solid #E8590C;font-size:40px}
td.wchk.on .box{background:var(--doneink);border-color:var(--doneink);color:#fff}
table.sheet td.chk.ro{width:40px;min-width:40px;padding:4px;cursor:default}
td.chk.ro .box{width:26px;height:26px;border-width:2px;border-radius:7px;font-size:17px;background:transparent}
td.chk.ro.on .box{background:var(--doneink)}
body.weld .pcut{pointer-events:none}
body.weld tr.tap{cursor:default}
.wring{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#E8590C;color:#fff}
.wring svg{width:34px;height:34px}
